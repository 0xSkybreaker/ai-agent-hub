[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag-agent"
version = "0.1.0"
description = "RAG Agent for document Q&A using NVIDIA NIM API"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []  # managed via requirements.txt

[project.scripts]
rag-agent = "rag_agent.cli:app"
rag-serve = "rag_agent.api.server:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
