[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-rag"
version = "0.1.0"
description = "Agentic RAG — ReAct Agent driving RAG retrieval autonomously"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []  # managed via requirements.txt

[project.scripts]
agentic-rag = "agentic_rag.cli:app"
agentic-serve = "agentic_rag.api.server:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
